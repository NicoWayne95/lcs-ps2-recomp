[package]
name = "lcs-release"
version = "0.1.0"
description = "LCS Recomp release tool: the signing key, the release package (kit zip, manifest.json, its signature)"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = "2"
getrandom = "0.2"
sha2 = "0.10"
serde_json = "1"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
strip = true
